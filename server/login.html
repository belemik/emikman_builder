<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · WDeaf Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/wdeaf-controls.css"><style>
:root{font-family:Manrope,-apple-system,sans-serif;color-scheme:light;--bg:#f4f6f9;--panel:#fff;--text:#191f29;--muted:#637086;--border:#dfe4eb}html[data-appearance=dark]{color-scheme:dark;--bg:#10141c;--panel:#191f2b;--text:#e6ebf4;--muted:#a4afc0;--border:#354052}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(420px,100%);padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:18px}h1{font-size:25px;letter-spacing:-1px;margin:22px 0 8px}p{color:var(--muted);font-size:13px;line-height:1.7}label{display:block;font-size:12px;margin:20px 0}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-top:8px}button{background:#0055ff;color:#fff;cursor:pointer;border-color:#0055ff;font-weight:700}button:disabled{opacity:.5}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #8db4ff;outline-offset:2px}.brand{background:#0055ff;color:white;border-radius:10px;padding:9px 13px;font-weight:bold;display:inline-block}#error{color:#d64b4b;min-height:22px}footer{margin-top:25px;border-top:1px solid var(--border);padding-top:5px}
.password-wrap{position:relative;margin-top:8px}.password-wrap input{margin-top:0;padding-right:56px}.password-toggle{position:absolute;right:8px;top:7px;width:36px;height:36px;margin:0;padding:6px;background:#fff;border:0;border-radius:4px;display:grid;place-items:center}.password-toggle:hover{background:#f0f3f8}.wdeaf-input{background:#fff;color:#191f29}.login-submit{width:100%;margin-top:8px}.login-input{margin-top:8px}</style></head><body><main><span class="brand">W</span><h1>Вход в WDeaf Builder</h1><p>Закрытый доступ для участников тестирования.</p><form id="login"><label>Логин<input class="wdeaf-input login-input" name="username" autocomplete="username" required maxlength="40" autofocus></label><label for="password">Пароль</label><div class="password-wrap"><input class="wdeaf-input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="password-toggle" id="password-toggle" type="button" aria-label="Показать пароль" title="Показать пароль" aria-controls="password" aria-pressed="false"><img class="wdeaf-icon" id="password-icon" src="/icons/eye.svg" width="24" height="24" alt=""></button></div><p id="error" role="alert"></p><button class="wdeaf-button login-submit" id="submit">Войти</button></form><footer><p>Доступ выдаёт владелец проекта. Оформление можно изменить в профиле после входа.</p></footer></main><script>
const media=matchMedia('(prefers-color-scheme: dark)');let mode='system';try{const saved=localStorage.getItem('wdeaf.appearance');if(['light','dark'].includes(saved))mode=saved}catch{}
function apply(){document.documentElement.dataset.appearance=mode==='system'?(media.matches?'dark':'light'):mode}apply();media.addEventListener('change',apply);
const password=document.querySelector('#password'),toggle=document.querySelector('#password-toggle'),icon=document.querySelector('#password-icon');
function hidePassword(){password.type='password';toggle.setAttribute('aria-pressed','false');toggle.setAttribute('aria-label','Показать пароль');toggle.title='Показать пароль';icon.src='/icons/eye.svg'}
toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.setAttribute('aria-pressed',String(show));toggle.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');toggle.title=show?'Скрыть пароль':'Показать пароль';icon.src=show?'/icons/eye-off.svg':'/icons/eye.svg'});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hidePassword()});
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();hidePassword();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const form=new FormData(event.target);const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});if(response.ok){location.replace('/');return}error.textContent=response.status===429?'Слишком много попыток. Повторите через 15 минут.':'Неверный логин или пароль.'}catch{error.textContent='Сервер недоступен. Попробуйте ещё раз.'}finally{button.disabled=false}});
</script></body></html>
