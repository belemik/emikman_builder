name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ds:validate
      - run: npm run build:server
      - name: Run portable TypeScript and Node tests
        shell: bash
        run: |
          shopt -s nullglob
          ts_tests=(tests/*.test.ts)
          node_tests=()
          for test_file in tests/*.test.mjs; do
            case "$test_file" in
              tests/project-durable-session-bridge.test.mjs|tests/project-session-authority.test.mjs|tests/project-session-store-recovery.test.mjs|tests/project-session-store.test.mjs) ;;
              *) node_tests+=("$test_file") ;;
            esac
          done
          test "${#ts_tests[@]}" -gt 0
          test "${#node_tests[@]}" -gt 0
          node node_modules/tsx/dist/cli.mjs --test "${ts_tests[@]}"
          node --test "${node_tests[@]}"
      - run: npm run build
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
